[project]
name = "decorar"
version = "0.1.0"
description = "Automate extracting Portuguese quiz cards from Anita's newsletter into Quizlet."
readme = "README.md"
authors = [
    { name = "karlacwm", email = "karlacheung73@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
]
llm = [
    "openai>=1.0.0",  # Or your chosen provider / local client
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"