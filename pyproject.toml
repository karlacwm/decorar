[project]
name = "decorar"
version = "0.1.0"
description = "Automate extracting Portuguese quiz cards from Anita's newsletter into Quizlet."
readme = "README.md"
authors = [
    { name = "karlacwm", email = "karlacheung73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
decorar = "decorar:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

